<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Intranet - Instituto</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Portal Académico</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuario o DNI</label>
                    <input type="text" id="username" placeholder="Ej. 74859612" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div id="errorMessage" class="error-msg" style="display: none;">
                    Credenciales incorrectas.
                </div>

                <button type="submit" class="btn-login">Ingresar al Sistema</button>
            </form>
            
            <div class="login-footer">
                <a href="../index.html">← Volver al portal público</a>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
