<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Intranet - Instituto Tech</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles/variables.css">
    <link rel="stylesheet" href="../css/styles/base.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-main">

    <main class="login-split-container">
        
        <div class="login-image-side" style="background-image: url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80');">
            <div class="login-overlay"></div>
        </div>

        <div class="login-form-side bg-main">
            <div class="login-card-inner">
                
                <div class="login-header">
                    <h1 class="text-primary" style="font-size: 32px; margin-bottom: 20px;">
                        Instituto<span class="text-accent">Tech</span>
                    </h1>
                    <h2 style="font-weight: 600; font-size: 24px; color: var(--text-main);">INTRANET ESTUDIANTE/DOCENTE</h2>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Usuario o DNI" required autocomplete="off">
                    </div>

                    <div class="input-group" style="position: relative;">
                        <input type="password" id="password" placeholder="Clave" required>
                        <i id="togglePassword" class="fa-solid fa-eye text-primary" style="position: absolute; right: 15px; top: 15px; cursor: pointer;"></i>
                    </div>
                    
                    <div style="text-align: left; margin-top: -10px; margin-bottom: 20px;">
                        <a href="#" class="forgot-link text-muted" style="font-size: 13px; text-decoration: none;">¿Olvidaste tu clave?</a>
                    </div>

                    <div id="errorMessage" class="error-msg" style="display: none;">
                        Credenciales incorrectas.
                    </div>

                    <button type="submit" class="btn-login">ENTRAR</button>
                </form>
                
                <div class="login-footer">
                    <a href="index.html" style="text-decoration: none; color: var(--color-primary); font-weight: 500; font-size: 14px;">← Volver al portal público</a>
                </div>

            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
</body>
</html>
