<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Seguro - Instituto Tech</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles/variables.css">
    <link rel="stylesheet" href="/css/styles/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        .checkout-container { background: white; max-width: 900px; width: 100%; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; display: flex;}
        
        .order-summary { background: #001f4d; color: white; padding: 40px; width: 40%; display: flex; flex-direction: column; justify-content: space-between;}
        .order-summary h2 { font-size: 24px; font-weight: 500; margin-bottom: 30px; opacity: 0.9;}
        .item-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px;}
        .item-row span { font-size: 14px; opacity: 0.8;}
        .item-row strong { font-size: 16px; text-align: right;}
        .total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px;}
        .total-row span { font-size: 16px; opacity: 0.8; }
        .total-row h1 { font-size: 36px; margin: 0; }
        .trust-badge { display: flex; align-items: center; gap: 10px; font-size: 12px; opacity: 0.7; margin-top: 50px;}
        .payment-form { padding: 50px 40px; width: 60%; }
        .payment-form h3 { font-size: 22px; color: #333; margin-bottom: 30px;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 8px; font-weight: 500;}
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 14px 15px; padding-left: 45px; border: 1px solid #ddd; border-radius: 8px; font-family: var(--font-family); font-size: 15px; outline: none; transition: 0.3s;}
        .input-wrapper input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1); }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; font-size: 18px;}
        
        .row-2 { display: flex; gap: 20px; }
        .row-2 .form-group { flex: 1; }
        .btn-pay { width: 100%; background: var(--color-primary); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 20px;}
        .btn-pay:hover { background: #004494; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,86,179,0.3);}
        .btn-pay:disabled { background: #999; cursor: not-allowed; transform: none; box-shadow: none; }
        .cancel-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px;}
        .cancel-link:hover { color: var(--accent-red); }
        @media (max-width: 768px) {
            .checkout-container { flex-direction: column; }
            .order-summary, .payment-form { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="order-summary">
            <div>
                <img src="/public/img/Jhalabet.png" alt="Logo" style="max-width: 150px; margin-bottom: 40px; filter: brightness(0) invert(1);">
                <h2>Resumen de Pago</h2>
                
                <div class="item-row">
                    <span>Concepto</span>
                    <strong id="payConcepto">Cargando...</strong>
                </div>
                <div class="item-row">
                    <span>Detalle</span>
                    <strong id="payDetalle">Cargando...</strong>
                </div>
                <div class="item-row" style="border: none;">
                    <span>Alumno</span>
                    <strong id="payStudentName">Estudiante</strong>
                </div>
                <div class="total-row">
                    <span>Total a pagar</span>
                    <h1 id="payMontoTotal">S/ 0.00</h1>
                </div>
            </div>
            <div class="trust-badge">
                <i class="fa-solid fa-lock" style="font-size: 20px;"></i>
                <p>Pago encriptado y seguro con tecnología SSL de 256 bits conectada con la pasarela bancaria.</p>
            </div>
        </div>

        <div class="payment-form">
            <h3>Detalles de la Tarjeta</h3>
            
            <form id="form-pago">
                <div class="form-group">
                    <label>Nombre en la tarjeta</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="EJ. JUAN PÉREZ" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Número de Tarjeta</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-credit-card"></i>
                        <!-- Agregamos id="cc-number" y cambiamos el placeholder -->
                        <input type="text" id="cc-number" placeholder="0000-0000-0000-0000" maxlength="19" required>
                    </div>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label>Fecha de Expiración</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-calendar"></i>
                            <!-- Agregamos id="cc-exp" -->
                            <input type="text" id="cc-exp" placeholder="MM/AA" maxlength="5" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Código CVV</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" placeholder="123" maxlength="4" required>
                        </div>
                    </div>
                </div>
                <button type="submit" id="btnProcesarPago" class="btn-pay">Procesar Pago</button>
                <a href="dashboard.html" class="cancel-link">Cancelar y volver al portal</a>
            </form>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 30px; opacity: 0.5;">
                <i class="fa-brands fa-cc-visa" style="font-size: 30px;"></i>
                <i class="fa-brands fa-cc-mastercard" style="font-size: 30px;"></i>
                <i class="fa-brands fa-cc-amex" style="font-size: 30px;"></i>
            </div>
        </div>
    </div>

<script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const cuotasJSON = localStorage.getItem("pasarela_cuotas_array");
            let total = localStorage.getItem("pasarela_total_suma");
            
            // Seguridad
            if (!token || !cuotasJSON || cuotasJSON === "[]") {
                alert("Acceso inválido. Selecciona al menos una cuota para pagar.");
                window.location.href = "dashboard.html";
                return;
            }

            const cuotasElegidas = JSON.parse(cuotasJSON);

            // 1. Inyectamos los datos en la pantalla
            const nombre = localStorage.getItem("usuarioNombre");
            if (nombre) document.getElementById("payStudentName").textContent = nombre;
            
            // Generar la lista de conceptos concatenada y detallada
            let textoConceptos = cuotasElegidas.map(c => c.concepto).join(', ');
            let textoDetalle = cuotasElegidas.map(c => "ID #" + c.id).join(', ');

            document.getElementById("payConcepto").textContent = textoConceptos;
            document.getElementById("payDetalle").textContent = textoDetalle;
            document.getElementById("payMontoTotal").textContent = "S/ " + parseFloat(total).toFixed(2);
            document.getElementById("btnProcesarPago").textContent = "Procesar Pago Total de S/ " + parseFloat(total).toFixed(2);

            // AUTO-FORMATO DE TARJETA (El mismo de antes)
            const ccNumber = document.getElementById("cc-number");
            const ccExp = document.getElementById("cc-exp");

            ccNumber.addEventListener("input", function(e) {
                let value = e.target.value.replace(/\D/g, ""); 
                let formattedValue = "";
                for (let i = 0; i < value.length; i++) {
                    if (i > 0 && i % 4 === 0) formattedValue += "-";
                    formattedValue += value[i];
                }
                e.target.value = formattedValue;
            });

            ccExp.addEventListener("input", function(e) {
                let value = e.target.value.replace(/\D/g, ""); 
                if (value.length > 2) value = value.substring(0, 2) + "/" + value.substring(2, 4);
                e.target.value = value;
            });

            // 2. PROCESAMIENTO MÚLTIPLE
            document.getElementById("form-pago").addEventListener("submit", async (e) => {
                e.preventDefault(); 
                
                const btn = document.getElementById("btnProcesarPago");
                const originalText = btn.textContent;
                
                // VALIDACIONES FECHA Y TARJETA
                if (ccNumber.value.length < 19) { alert("El número de tarjeta está incompleto."); return; }
                if (ccExp.value.length === 5) {
                    const [month, year] = ccExp.value.split("/");
                    const currentYear = new Date().getFullYear() % 100;
                    const currentMonth = new Date().getMonth() + 1;
                    if (parseInt(month) < 1 || parseInt(month) > 12) { alert("Error: El mes es inválido."); return; }
                    if (parseInt(year) < currentYear || (parseInt(year) === currentYear && parseInt(month) < currentMonth)) {
                        alert("Error: La tarjeta ingresada se encuentra expirada."); return;
                    }
                } else { alert("Error: Formato de expiración incorrecto (MM/AA)."); return; }

                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando cuotas...';
                btn.disabled = true;

                try {
                    // Magia Negra: Enviamos un POST al backend POR CADA CUOTA seleccionada
                    for (let cuota of cuotasElegidas) {
                        const urlPago = `http://localhost:8080/api/v1/pagos/pagar?idCuota=${cuota.id}&monto=${cuota.monto}&metodoPago=TARJETA_CREDITO`;
                        const res = await fetch(urlPago, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (!res.ok) throw new Error("Fallo en la transacción de la cuota: " + cuota.concepto);
                    }

                    // Si termina el bucle for sin errores, limpiamos y ganamos:
                    localStorage.removeItem("pasarela_cuotas_array");
                    localStorage.removeItem("pasarela_total_suma");
                    
                    alert("¡Felicidades! Todas las cuotas seleccionadas fueron pagadas con éxito.");
                    window.location.href = "dashboard.html";

                } catch (error) {
                    console.error("Fallo al procesar múltiples pagos:", error);
                    alert("Hubo un error con tu banco y la transacción fue detenida. Verifica los fondos.");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
